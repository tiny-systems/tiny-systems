<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Systems</title>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="drag"></div>
      <div class="brand">
        <span id="brand-mark"></span>
        <span class="wordmark">Tiny Systems</span>
      </div>
      <nav id="gardens" class="gardens" aria-label="Your gardens"></nav>
      <button class="plant-garden" id="add-machine">
        <span class="plus" aria-hidden="true">+</span> Plant a new garden
      </button>
      <div class="rail-foot">
        <a href="#" id="docs">Help</a>
        <span id="version"></span>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div class="titles">
          <h1 id="garden-name">Your garden</h1>
          <p id="garden-summary" class="summary"></p>
        </div>
        <button id="new-btn" class="btn primary">New helper</button>
      </header>

      <div id="notices" class="notices"></div>

      <section class="greenhouse" aria-label="Helpers">
        <div id="beds" class="beds"></div>
        <div id="empty" class="empty" hidden>
          <div id="empty-art"></div>
          <h2>Nothing growing here yet</h2>
          <p>A helper is an AI that works on one task for you, in this garden, until it's done.</p>
          <button class="btn primary" id="empty-new">Plant your first helper</button>
        </div>
      </section>

      <section class="watch" id="watch" hidden>
        <div class="watch-bar">
          <div class="tabs" id="tabs" role="tablist"></div>
          <button class="btn quiet small" id="watch-close">Hide</button>
        </div>
        <div class="term-host" id="term-host"></div>
      </section>
    </main>

    <aside class="sheet" id="sheet" hidden aria-label="Helper"></aside>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" method="dialog">
      <h2>New helper</h2>
      <label class="field">What should it do?
        <textarea name="task" rows="4" placeholder="Fix the flaky checkout test and open a pull request"></textarea>
      </label>
      <label class="field">Link to the code <span class="opt">optional</span>
        <input name="repo" placeholder="https://github.com/you/your-project">
      </label>
      <details class="advanced">
        <summary>Advanced</summary>
        <div class="row2">
          <label class="field">Assistant
            <select name="agent"><option value="">Claude Code</option><option value="codex">Codex</option></select>
          </label>
          <label class="field">Model <input name="model" placeholder="default"></label>
        </div>
        <label class="field">Container image <input name="image" placeholder="default"></label>
      </details>
      <p class="hint">Leave the task empty to start a helper you talk to directly.</p>
      <div class="actions">
        <button type="button" class="btn quiet" id="new-cancel">Cancel</button>
        <button type="submit" class="btn primary">Plant helper</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog small">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="body"></p>
      <div class="actions">
        <button class="btn quiet" value="cancel">Keep it</button>
        <button class="btn danger" value="ok">Send home</button>
      </div>
    </form>
  </dialog>

  <dialog id="wizard" class="dialog wizard">
    <div class="wz" id="wz"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
