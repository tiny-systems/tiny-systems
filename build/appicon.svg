<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A22"/>
      <stop offset="1" stop-color="#0E1310"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#46D87A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#46D87A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA35A"/>
      <stop offset="1" stop-color="#7BF0A2"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2A8F50"/>
      <stop offset="1" stop-color="#4FD07F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- soil line -->
    <path d="M300 760 H724" stroke="#46D87A" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(512 520) scale(30) translate(-12 -12.2)">
      <path d="M12 20 V11.4" stroke="#46D87A" stroke-width="0.85" stroke-linecap="round" fill="none"/>
      <path d="M12 13.5 C8.5 13.6 6 11.4 5.6 7.6 C9.3 7.7 11.8 9.8 12 13.5 Z" fill="url(#leaf2)"/>
      <path d="M11.6 13 C9.6 11.9 7.8 10.2 6.6 8.6" stroke="#0E1310" stroke-opacity="0.28" stroke-width="0.28" stroke-linecap="round" fill="none"/>
      <path d="M12 11 C12.2 7.2 14.8 4.6 18.6 4.4 C18.4 8.4 15.8 10.8 12 11 Z" fill="url(#leaf)"/>
      <path d="M12.5 10.4 C14.2 8.6 15.9 6.9 17.7 5.3" stroke="#0E1310" stroke-opacity="0.25" stroke-width="0.28" stroke-linecap="round" fill="none"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rim)" stroke-width="3"/>
