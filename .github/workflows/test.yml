# Tests on every push and pull request: Go (with the race detector), the
# frontend build, and the web demo build. The Lima installer tests need a
# VM and run by hand (see README).
name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build && npm run build:web
      - name: Vet
        run: go vet ./... && go vet -tags lima ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
