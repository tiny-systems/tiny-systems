# Tests on every push and pull request: scripts/check.sh, the same checks
# the pre-push hook runs locally (gofmt, vet, Go with the race detector, the
# frontend builds, and a click-through of the UI on the web build). The Lima installer tests need a
# VM and run by hand (see README).
name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browsers for the click-through
        working-directory: frontend
        run: npm ci && npx playwright install chromium
      # The same script the pre-push hook runs (.githooks/pre-push).
      - name: Checks
        run: scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: frontend/test-results
          retention-days: 7
