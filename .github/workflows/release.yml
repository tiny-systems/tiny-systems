# Tag vX.Y.Z to build a signed, notarized Tiny Systems.dmg and attach it
# to the GitHub release.
#
# Two jobs, so build code (npm packages, wails) never runs next to the
# signing keys: `build` has no secrets and a read-only token; `sign` runs
# only Apple's tools on the built app, under the `release` environment.
#
# Secrets live on the `release` environment (scripts/signing-secrets.sh):
#   MACOS_CERT_P12        base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD   its password
#   NOTARY_KEY_P8         base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID         that key's ID
#   NOTARY_ISSUER         the App Store Connect issuer ID
# Protect it in Settings → Environments: required reviewer, and deployments
# only from v* tags and main.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (no release is made)
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Build (unsigned)
        run: scripts/release-mac.sh build "${{ steps.v.outputs.version }}"
      - name: Pack app
        run: tar -C build/bin -czf app.tgz "Tiny Systems.app"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tgz
          retention-days: 3

  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      SIGN_IDENTITY: 'Developer ID Application: Tiny Systems Limited (74JHK2JWS7)'
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Only the release script and entitlements are needed from the repo.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-mac.sh
            build/darwin/entitlements.plist
            build/darwin/lima.entitlements
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: app
      # The artifact is build output: take only the app, nothing outside it.
      - name: Unpack app
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $VERSION"; exit 1; }
          if tar -tzf app.tgz | grep -vE '^Tiny Systems\.app(/|$)' | grep -q .; then echo "unexpected paths in artifact"; exit 1; fi
          if tar -tzf app.tgz | grep -q '\.\./'; then echo "path traversal in artifact"; exit 1; fi
          rm -rf build/bin && mkdir -p build/bin
          tar -C build/bin -xzf app.tgz 'Tiny Systems.app'
          if find "build/bin/Tiny Systems.app" -type l -lname '/*' | grep -q .; then echo "absolute symlink in app"; exit 1; fi

      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Sign, notarize, staple
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$P8" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/release-mac.sh sign "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/bin/Tiny-Systems-${{ env.VERSION }}.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Tiny Systems $GITHUB_REF_NAME" --generate-notes
          # Also as Tiny-Systems.dmg, so the website can link to
          # releases/latest/download/Tiny-Systems.dmg and never go stale.
          cp "build/bin/Tiny-Systems-$VERSION.dmg" build/bin/Tiny-Systems.dmg
          (cd build/bin && shasum -a 256 "Tiny-Systems-$VERSION.dmg" Tiny-Systems.dmg > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" "build/bin/Tiny-Systems-$VERSION.dmg" build/bin/Tiny-Systems.dmg build/bin/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
